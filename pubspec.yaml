name: you_too_art
description: "A social and casting platform connecting actors, artists, and production houses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Riverpod 3.x
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^14.8.1

  # Backend — Supabase
  supabase_flutter: ^2.10.2

  # Media & SVG
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17

  # Local storage
  shared_preferences: ^2.5.3

  # Networking
  http: ^1.4.0

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
